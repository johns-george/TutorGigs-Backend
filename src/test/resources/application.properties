spring.application.name=tutorapp

# H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable email in tests
spring.mail.host=localhost
spring.mail.port=25

# JWT secret for tests
JWT_SECRET=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHk=

# Frontend URL for tests
FRONTEND_URL=http://localhost:5173

# Kafka / Redis are not started in unit tests
chat.kafka.enabled=false
app.security.trust-forwarded-headers=false
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Disable Flyway in tests (H2 uses create-drop)
spring.flyway.enabled=false

# Logging
logging.level.org.springframework.security=WARN
