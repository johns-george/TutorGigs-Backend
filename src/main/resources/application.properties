spring.application.name=tutorapp

# ── Database (required — no defaults) ──────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${SERVER_PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ─────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── SpringDoc OpenAPI ──────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.filter=WARN

# ── Mail (required — no defaults) ──────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Redis (optional — defaults for local dev) ──────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Only honor X-Forwarded-For when this app sits behind a trusted proxy
app.security.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}

# ── Kafka chat delivery ────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
chat.kafka.enabled=${CHAT_KAFKA_ENABLED:true}
chat.presence.ttl-seconds=90
chat.presence.ping-interval-ms=30000
